services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bakalio-api:0.2.0
    environment:
      DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/research
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      WASP_WEB_CLIENT_URL: ${PUBLIC_WEB_URL:-http://localhost:4310}
      WASP_SERVER_URL: ${PUBLIC_API_URL:-http://localhost:4311}
      PORT: 4311
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-research}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-local-mail-only}
      PRIVATE_STORAGE_PATH: /private/files
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes: ["research_files:/private/files"]
    ports: ["0.0.0.0:4311:4311"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4311/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      start_period: 40s
      retries: 5
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: bakalio-web:0.2.0
    ports: ["0.0.0.0:4310:80"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      retries: 3
