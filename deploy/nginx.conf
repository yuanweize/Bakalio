server {
 listen 80;
 server_name _;
 absolute_redirect off;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 gzip on;
 gzip_comp_level 6;
 gzip_vary on;
 gzip_types text/css application/javascript application/json image/svg+xml;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location /api/ { proxy_pass http://api:4311/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 15m; }
 location / { try_files $uri $uri/index.html /200.html; }
 location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
 location = /health { access_log off; return 200 'ok'; }
}
